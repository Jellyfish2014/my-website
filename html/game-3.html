<body>                                                            <!-- /* 主內容開始 */   -->
  <!-- <div id="width-display" style="position: fixed; top: 10px; left: 10px; background: black; color: white; padding: 2px; z-index: 9999;"></div>    這句程式碼中沒有設定 font-size 屬性，因此它的字體大小會直接採用瀏覽器的預設值，在絕大多數瀏覽器中，這個預設大小是 16px。 -->
  <h1>🎾 打磚塊（3條命）</h1>                                      <!-- /* 網頁上的遊戲標題 */  -->
  <canvas id="gameCanvas"></canvas>                               <!-- /* 建立畫布（遊戲主要畫面） */  -->
  <div id="info">                                                 <!-- /* 包含分數與生命的區塊 */  -->
    分數：<span id="score">0</span>　                              <!-- /* 顯示分數初始值 0 */  -->
    生命：<span id="lives">❤️❤️❤️</span>                         <!-- /* 顯示三顆愛心代表三條命 */  -->
  </div>                                                          <!-- /* 結束 info 區塊 */  -->
  <div class="button-row">
    <button id="pause">暫停</button>                        
    <button id="restartBtn">重新開始</button>
  </div>

<script>                                                         
const canvas = document.getElementById("gameCanvas");            
const ctx = canvas.getContext("2d");                             
const winDisplay = document.getElementById("win");   
const scoreDisplay = document.getElementById("score");           
const livesDisplay = document.getElementById("lives");           
const pause = document.getElementById("pause");
const restartBtn = document.getElementById("restartBtn");        

const original_brickOffsetTop = 12;                              
const original_brickOffsetLeft = 5;                              
const original_brickPadding = 5;                                 
let brickRowCount = 5;                                           
let brickColumnCount = 8;                                        
const original_brickHeight = 18;    
let brickWidth;                                                  

const original_ballRadius = 8;                                               

const original_paddleHeight = 12;                                            
const original_paddleWidth = 70;                                             

const widthin_large = 400;      
const widthout_large = widthin_large / 0.92
const heightin_large = widthout_large * 1.18;  
const heightout_large = heightin_large * 1.37;     

let x, y, dx, dy, paddleX, size, current_scale;   
let score = 0;                                                 
let lives = 3;                                                 
let bricks = [];                                               
let rightPressed = false;                                      
let leftPressed = false;                                       
const original_scale = 1;     
const small_scale = 0.65;                                          
let gameRunning = true;                                        
let ballActive = true;                                         
let isDragging = false;                                        
let win_status = false;
// // ------------------------------
function  initialize() {                                         
  if (window.innerHeight > heightout_large* 0.88) {  

    size = 'large'
    // scale = 1;  
    canvas.width = widthin_large;                                          
    canvas.height = heightin_large;
    x = canvas.width / 2;                                           
    y = canvas.height - 30*original_scale;                                   
    dx = 3 * original_scale;                                                 
    dy = -3 * original_scale;          
    brickOffsetTop = original_brickOffsetTop * original_scale;  
    brickOffsetLeft = original_brickOffsetLeft * original_scale;  
    brickPadding = original_brickPadding * original_scale; 
    brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;      
    brickHeight = original_brickHeight * original_scale;       
    ballRadius = original_ballRadius * original_scale;
    paddleWidth = original_paddleWidth * original_scale;                                       
    paddleHeight = original_paddleHeight * original_scale;   
    paddleX = (canvas.width - paddleWidth) / 2;       

  } else {  
    size = 'small'
    // scale = 0.65; 
    canvas.height = heightin_large * small_scale;                                            
    canvas.width = widthin_large * small_scale;     
    x = canvas.width / 2;                                           
    y = canvas.height - 30*small_scale;                                   
    dx = 3 * small_scale;                                                 
    dy = -3 * small_scale;                                                
    brickOffsetTop = original_brickOffsetTop * small_scale;  
    brickOffsetLeft = original_brickOffsetLeft * small_scale;  
    brickPadding = original_brickPadding * small_scale; 
    brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;      
    brickHeight = original_brickHeight * small_scale;       
    ballRadius = original_ballRadius * small_scale;
    paddleWidth = original_paddleWidth * small_scale;                                       
    paddleHeight = original_paddleHeight * small_scale;   
    paddleX = (canvas.width - paddleWidth) / 2;     

    }                                     
                      
  score = 0;                                                      
  lives = 3;                                                      
  scoreDisplay.textContent = score;                               
  livesDisplay.textContent = "❤️".repeat(lives);           
  gameRunning = true;                          
  // gameRunning = false;   

  bricks = [];                                                    /* 清空並建立一個名為 bricks 的空陣列 */
  for(let c=0; c<brickColumnCount; c++){                          /* 外層迴圈：每一列磚塊 */
    bricks[c] = [];                                               /* 每列建立一個子陣列 */
    for(let r=0; r<brickRowCount; r++){                           /* 內層迴圈：每行磚塊 。 let r=0;：初始化。宣告一個變數 r（通常代表 row / 列）並將它設為 0。這代表迴圈從第 0 行開始。r<brickRowCount;：執行條件。只要 r 小於 brickRowCount（磚塊的總行數），迴圈就會持續執行。r++：遞增。每跑完一次迴圈，r 的數值就會增加 1（相當於 \(r = r + 1\)）。*/
      bricks[c][r] = { x:0, y:0, status:1 };                      /* 為每一塊磚建立物件（位置與是否存在）。 bricks[c][r]：代表二維陣列 bricks 中，第 c 行（column）第 r 列（row）的磚塊。x: 0, y: 0：設定該磚塊在遊戲畫面的繪製座標（通常會在迴圈後續計算實際像素位置）。status: 1：設定磚塊的狀態為「存在／可見」（通常 1 代表活著，當球擊中磚塊時會改為 0 來讓磚塊消失）。 */
    }                                                             /* 結束內層迴圈 */
  }                                                               /* 結束外層迴圈 */
}                                                                 /* 結束  initsizeCanvas 函式 */

// -------------------------
function resizeCanvas() {                                        
  if (size == 'large'){
    if (window.innerHeight > heightout_large * 0.88) {  
      // scale = 1;   
      canvas.width = widthin_large;                                           
      canvas.height = heightin_large;    
      x = x;                                   
      y = y;                                 
      dx = dx;                                                 
      dy = dy;    
      brickPadding = original_brickPadding;  
      brickOffsetTop = original_brickOffsetTop; 
      brickOffsetLeft = original_brickOffsetLeft; 
      brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;      /* 根據畫布寬度自動計算每個磚塊的寬度 */
      brickHeight = original_brickHeight;                                       
      ballRadius = original_ballRadius;                                         
      paddleWidth = original_paddleWidth;                                       
      paddleHeight = original_paddleHeight;        

      paddleX = paddleX;
      // size = 'large' 

    } else {  
        // scale = 0.65
        canvas.width = widthin_large * small_scale;        
        canvas.height = heightin_large * small_scale;          
        x = x* small_scale;                                   
        y = y * small_scale;                                 
        dx = dx * small_scale;                                                 
        dy = dy * small_scale;    
        brickPadding = original_brickPadding * small_scale;  
        brickOffsetTop = original_brickOffsetTop * small_scale; 
        brickOffsetLeft = original_brickOffsetLeft * small_scale; 
        brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;    
        brickHeight = original_brickHeight * small_scale;                                     
        ballRadius = original_ballRadius * small_scale;                                         

        paddleWidth = original_paddleWidth * small_scale;                                       
        paddleHeight = original_paddleHeight * small_scale;                                       

        paddleX = (paddleX + original_paddleWidth/2)*small_scale-(original_paddleWidth * small_scale/2);    
        size = "small"    
      } 
  } else if (size == 'small'){
      if (window.innerHeight <= heightout_large * 0.88) {  
          // scale = 1;   
          canvas.width = widthin_large * small_scale;                                           
          canvas.height = heightin_large * small_scale;    
          x = x;                                   
          y = y;                                 
          dx = dx;                                                 
          dy = dy;    
          brickPadding = original_brickPadding * small_scale;  
          brickOffsetTop = original_brickOffsetTop * small_scale; 
          brickOffsetLeft = original_brickOffsetLeft * small_scale; 
          brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;    
          brickHeight = original_brickHeight * small_scale;                                     
          ballRadius = original_ballRadius * small_scale;                                        

          paddleWidth = original_paddleWidth * small_scale;                                       
          paddleHeight = original_paddleHeight * small_scale;   

          paddleX = paddleX;     
          // size = "small" 

      } else {  
          // scale = 1/0.65
          canvas.width = widthin_large;        
          canvas.height = heightin_large;          
          x = x / small_scale;                                   
          y = y / small_scale;                                 
          dx = dx / small_scale;                                                 
          dy = dy / small_scale;    
          brickPadding = original_brickPadding;  
          brickOffsetTop = original_brickOffsetTop; 
          brickOffsetLeft = original_brickOffsetLeft; 
          brickWidth = (canvas.width - brickOffsetLeft*2 - (brickColumnCount-1)*brickPadding) / brickColumnCount;      
          brickHeight = original_brickHeight;                                       
          ballRadius = original_ballRadius;                                        

          paddleWidth = original_paddleWidth;                                       
          paddleHeight = original_paddleHeight;                                       

          paddleX = (paddleX + original_paddleWidth*small_scale/2)/small_scale-(original_paddleWidth/2); 
          size = 'large'
        } 
    }
  }  
                                                               
// -----------------------------
function play() {
  ctx.clearRect(0,0,canvas.width,canvas.height);                 /*清除整個 HTML5 Canvas 畫布上的所有內容，使其恢復為完全透明的初始狀態。*/

  x = x + dx;                                                   
  y = y + dy;        

  drawBricks();                                                  /* 繪出磚塊。 */
  drawBall();                                                    /* 繪出球。 */
  drawPaddle();                                                  /* 繪出球拍。 */
  collisionDetection();                                          /* 檢查碰撞。 */

  if(win_status){  
    if (size =='large') ctx.font = '4vh Arial'; else  {ctx.font = '3vh Arial'};
    ctx.fillStyle = '#333333';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";  
    ctx.fillText('🎉 你贏了！恭喜破關！', canvas.width/2, canvas.height/2);     
  }
  if(x + dx > canvas.width - ballRadius || x + dx < ballRadius){  /* ||：意思是「或」。  當球碰到畫布的左右邊界時，就將球在水平方向的移動速度（dx）反向，讓球反彈。 */
    dx = -dx;                 
    x = x + dx;                                                   
    y = y + dy;
  }
  if(y + dy < ballRadius){                                      /* 撞到上邊反彈。在 HTML Canvas 中，座標原點 (0,0) 位於畫布的左上角。 */
    dy = -dy;   
    x = x + dx;                                                   
    y = y + dy;
  }  
  
  if (size =='large') current_scale = original_scale; else  {current_scale = small_scale};       
  if(y + dy > canvas.height - paddleHeight - 10*current_scale - ballRadius){     /* 檢查是否到達底部。 */
    if(win_status) {
      gameRunning = false; 
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if (size='large') ctx.font = '4vh Arial'; else  {ctx.font = '3vh Arial'};  
      ctx.fillStyle = '#333333';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";     
      ctx.fillText('🎉 你贏了！恭喜破關！', canvas.width/2, canvas.height/2);      
    }    

    else if(x > paddleX && x < paddleX + paddleWidth){                  /* 若球在球拍範圍內。 */
            x = x + dx +((Math.random() - 0.5) * 10.5);                 /* 增加隨機橫向變化。生成一个大于或等于 0 且小于 1 的伪随机浮点数。 */
            y = y + (-dy * 1.05);                                      /* 向上反彈，並略微加速。 */
            dy = -dy;  
            if ((Math.random() - 0.5) > 0) dx = dx; 
            else {dx = -dx};   
    }   
  }            
  
  if(y + dy > canvas.height - ballRadius){         
    loseLife();                                            
    return;                                                           // 碰到地板扣命後，立刻結束 play() 函式，不再往下跑                            
  } 

  if (size =='large') current_scale = original_scale; else  {current_scale = small_scale};    
  if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 5 * current_scale;        /* 若按右鍵，球拍右移。 */
  else if(leftPressed && paddleX > 0) paddleX -= 5 * current_scale;                             /* 若按左鍵，球拍左移。 */

  if(gameRunning) requestAnimationFrame(play);                   /* 若遊戲未結束，重複執行 draw（每秒約 60 次）。 */
}                                                                /* 結束 draw 函式。 */
// ------------------------------
function drawBricks() {                                           /* 定義繪製磚塊的函式。 */
  for(let c=0; c<brickColumnCount; c++){                          /* 外層迴圈：列。 */
    for(let r=0; r<brickRowCount; r++){                           /* 內層迴圈：行。 */
      if(bricks[c][r].status === 1){                              /* 只畫出尚未被打掉的磚塊。 */
        const brickX = brickOffsetLeft + c*(brickWidth + brickPadding);      /* 計算該磚塊的 X 位置。 */
        const brickY = brickOffsetTop + r*(brickHeight + brickPadding);      /* 計算該磚塊的 Y 位置。 */
        bricks[c][r].x = brickX;                                             /* 更新磚塊物件的 x。 */
        bricks[c][r].y = brickY;                                             /* 更新磚塊物件的 y。 */
        const grad = ctx.createLinearGradient(brickX, brickY, brickX, brickY+brickHeight);    /* 建立磚塊的垂直漸層色彩。 */
        grad.addColorStop(0, "#ff9966");                         /* 漸層上方顏色。 */
        grad.addColorStop(1, "#ff3300");                         /* 漸層下方顏色。 */
        ctx.fillStyle = grad;                                    /* 設定填充顏色。 */
        ctx.strokeStyle = "#b32d00";                             /* 設定邊框顏色。 */
        ctx.beginPath();                                         /* 開始畫圖路徑。 */

        if (size =='large') current_scale = original_scale; else  {current_scale = small_scale};            
        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 5*current_scale);   /* 繪製圓角矩形磚塊。 */
        ctx.fill();                                              /* 填滿顏色。 */
        ctx.stroke();                                            /* 畫邊框。 */
      }                                                          /* 結束 if。 */
    }                                                            /* 結束內層 for。  */     
  }                                                              /* 結束外層 for。 */
}                                                                /* 結束 drawBricks。 */
// --------------------------------
function drawBall() {                                            /* 定義繪製球的函式。 */
  const grad = ctx.createRadialGradient(x - ballRadius/2, y - ballRadius/2, ballRadius/4, x, y, ballRadius);   /* 建立球的光暈漸層。 */
  grad.addColorStop(0, "#fff");                                  /* 中心白亮。 */
  grad.addColorStop(1, "#ff4444");                               /* 外圈紅色。 */
  ctx.fillStyle = grad;                                          /* 設定填充樣式。 */
  ctx.beginPath();                                               /* 開始繪製。 */
  ctx.arc(x, y, ballRadius, 0, Math.PI*2);                       /* 畫圓。x：圓心的 X 座標。y：圓心的 Y 座標。ballRadius：圓的半徑。0：起點角度（從 0 弧度開始，即右側水平方向）。Math.PI * 2：終點角度（Math.PI 是 180 度，乘以 2 就是 360 度，代表畫一整圈）。 */
  ctx.fill();                                                    /* 填滿球體。 */
  ctx.strokeStyle="#aa0000";                                     /* 外框線紅色。 */
  ctx.stroke();                                                  /* 畫外框。 */
}                                                                /* 結束 drawBall。 */
// --------------------------------
function drawPaddle() {                                          /* 定義繪製球拍函式。 */
  const grad = ctx.createLinearGradient(paddleX, canvas.height-paddleHeight, paddleX, canvas.height);      /*  建立藍色漸層。 */
  grad.addColorStop(0, "#004080");                               /* 上方深藍。 */
  grad.addColorStop(1, "#0099ff");                               /* 下方亮藍。 */
  ctx.fillStyle = grad;                                          /* 設定顏色。 */
  ctx.beginPath();                                               /* 開始繪圖。 */
  // ctx.roundRect(paddleX, canvas.height-paddleHeight-2*scale, paddleWidth, paddleHeight, 6*scale);    /* 畫出球拍矩形。6 * scale：矩形圓角半徑。數值由基礎圓角 6 乘上畫面縮放比例 scale */
  
  if (size =='large') current_scale = original_scale; else  {current_scale = small_scale};   
  ctx.roundRect(paddleX, canvas.height-paddleHeight-2*current_scale, paddleWidth, paddleHeight, 6*current_scale); 
  ctx.fill();                                                    /* 填滿球拍顏色。 */
  ctx.strokeStyle="#002244";                                     /* 球拍邊框色。 */
  ctx.stroke();                                                  /* 畫出邊框。 */
}                                                                /* 結束 drawPaddle。 */
// --------------------------------
function collisionDetection() {                                  /* 磚塊碰撞偵測函式。 */
  for(let c=0;c<brickColumnCount;c++){                           /* 外層列迴圈。 */
    for(let r=0;r<brickRowCount;r++){                            /* 內層行迴圈。 */
      const b=bricks[c][r];                                      /* 取出每一塊磚。 */
      if(b.status===1){                                          /* 只判斷還存在的磚。 */
        if(x>b.x && x<b.x+brickWidth && y>b.y && y<b.y+brickHeight){                                        /* 判斷球是否打到磚塊範圍內。 */
          dy = -dy;                                              /* 碰到後反彈。 */
          b.status = 0;                                          /* 設為被打掉。 */
          score++;                                               /* 分數 +1。 */
          scoreDisplay.textContent = score;                      /* 更新畫面。 */
          if(score === brickRowCount*brickColumnCount){          /* 若分數達全部磚塊總數。 */
            win_status = true;
          }                                                      /*  結束 if。 */
        }                                                        /*  結束反彈 if。 */
      }                                                          /* 結束碰撞 if。 */
    }                                                            /* 結束行迴圈。 */
  }                                                              /* 結束列迴圈。 */
}                                                                /*  結束函式。 */ 
// --------------------------------
function loseLife() {                                            /* 定義扣命函式。 */
  lives--;                                                       /* 生命減一。 */
  updateLives();                                                 /* 更新畫面。 */
  if(lives > 0){                                                 /* 若還有命。 */
    // 暫停一秒再重新發球
    ballActive = false;                                          /* 暫停球。 */
    x = canvas.width / 2;                                        /* 重置球位置。 */
    if (size =='large') current_scale = original_scale; else  {current_scale = small_scale};   
    y = canvas.height - 30*current_scale;                                /* 重置球 Y */
    // dx = 3 * scale;                                              /* 重置球的水平移動速度。 */
    // dy = -3 * scale;                                             /* 重置球的垂直移動速度。 */
    if (size =='large') {dx = 3; dy = -3} else {dx = 3 * small_scale; dy = -3 * small_scale}; 

    paddleX = (canvas.width - paddleWidth) / 2;                  /* 將接球的擋板 (paddle) 位置重置到畫面正中央。 */
    setTimeout(()=>{ ballActive = true; play(); }, 1250);        /* 設定一個 1000 毫秒（1 秒）的計時器。時間到後，將 ballActive 設回 true（恢復球的移動），並呼叫 draw() 重新繪製畫面以開始新的一局。 */
  } else {                                                       /* 如果生命數小於或等於 0（即扣完最後一條命）。 */
    gameRunning = false;                                         /* 將遊戲執行狀態設為關閉，停止遊戲主循環。 */
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if (size =='large') ctx.font = '4vh Arial'; else  {ctx.font = '3vh Arial'};  
    // ctx.font = '4vh Arial';  
    ctx.fillStyle = '#333333';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("💥 遊戲結束！分數：" + score, canvas.width/2, canvas.height/2);  
    win_status = false;
    // alert("💥 遊戲結束！分數：" + score);                         /* 跳出一個彈跳視窗，顯示遊戲結束訊息與玩家的最終得分 (score)。 */
  }                                                              /*  結束else。 */ 
}                                                                /*  結束函式。 */ 
// -------------------------------
function updateLives() {                                          /* 定義更新生命顯示的函式。 */
  livesDisplay.textContent = "❤️".repeat(lives);                  /* 顯示與目前生命數相同的愛心數量。 */
}                                                                 /* 結束 updateLives。 */

// --- 視窗大小改變監聽 ---
window.addEventListener('resize', resizeCanvas);                       /* 當視窗大小改變時，重新執行 resizeCanvas() */

// --- 鍵盤按下監聽 ---
document.addEventListener("keydown", e=>{                              /* 為整個網頁文件 (document) 註冊一個監聽器，偵測「按下按鍵 (keydown)」的動作。e 是事件物件（包含按鍵資訊）。 */
  if(e.key==="Right" || e.key==="ArrowRight") rightPressed=true;       /* 如果按下的鍵是右方向鍵（舊版瀏覽器名稱為 "Right"，新版為 "ArrowRight"），就將右移變數 rightPressed 設為 true。 */
  else if(e.key==="Left" || e.key==="ArrowLeft") leftPressed=true;     /* 否則，如果按下的鍵是左方向鍵（舊版為 "Left"，新版為 "ArrowLeft"），就將左移變數 leftPressed 設為 true。 */
});                                                                    /* 結束第一個事件監聽器。 */
// --- 鍵盤放開監聽 ---
document.addEventListener("keyup", e=>{                                /* 為網頁文件註冊另一個監聽器，偵測「放開按鍵 (keyup)」的動作。 */
  if(e.key==="Right" || e.key==="ArrowRight") rightPressed=false;      /* 如果放開的是右方向鍵，就將 rightPressed 設為 false（停止向右）。 */
  else if(e.key==="Left" || e.key==="ArrowLeft") leftPressed=false;    /* 如果放開的是左方向鍵，就將 leftPressed 設為 false（停止向左）。 */
});                                                                    /* 結束第二個事件監聽器。 */

// --- 手機觸控監聽 ---
canvas.addEventListener("touchmove", e=>{                              /* 為畫布 (canvas) 註冊一個監聽器，偵測「手指在螢幕上滑動 (touchmove)」的動作。e 是觸控事件物件。 */
  const rect = canvas.getBoundingClientRect();                         /* 取得整個 canvas 畫布在目前瀏覽器視窗中的絕對位置與大小（包含它距離視窗最左邊 left 和最頂端 top 的像素距離）。 */
  const moveX = e.touches[0].clientX - rect.left;                      /* 代表第一根手指在目前視窗中的 X 軸位置。 減去 rect.left（畫布左邊緣的視窗位置）後，就能精準算出手指此時在 canvas 畫布內部的相對 X 座標，存入 moveX。*/
  paddleX = moveX - paddleWidth/2;                                     /* 將擋板的左上角 X 座標 (paddleX) 設定為「手指位置減去擋板寬度的一半」。 這樣做能讓擋板的中心點剛好對齊手指，滑動時視覺體驗最流暢、最直覺。*/
  if(paddleX < 0) paddleX = 0;                                         /* 如果算出來的擋板位置跑到畫布左邊緣外面 (< 0)，就把位置強制鎖定在最左邊 (= 0)。 */
  if(paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;      /* 如果擋板右邊緣的位置 (paddleX + paddleWidth) 超過畫布的總寬度，就把位置鎖定在最右邊（即總寬度減去擋板寬度）。 */
  e.preventDefault();                                                  /* 阻止手機網頁的預設滑動行為（例如：在手機上往下滑動網頁通常會重新整理，或者會拉動整個網頁畫面）。這樣能確保玩家在玩遊戲時，畫面不會亂飄。 */
});                                                                    /* 結束觸控事件監聽器。 */

// --- 滑鼠按下監聽 ---
canvas.addEventListener("mousedown", e=>{                              /* 監聽滑鼠在畫布上「按下」的動作。 */
  const rect = canvas.getBoundingClientRect();                         /* 取得 canvas 畫布在目前視窗中的絕對位置與大小。 */
  const mouseX = e.clientX - rect.left;                                /* 計算滑鼠按下時，在 canvas 內部的相對 X 軸座標。 */
  const mouseY = e.clientY - rect.top;                                 /* 計算滑鼠按下時，在 canvas 內部的相對 Y 軸座標。 */
  if(mouseY > canvas.height - paddleHeight - 20 && mouseX > paddleX && mouseX < paddleX + paddleWidth){            /* 檢查滑鼠點擊的位置，有沒有落在擋板的碰撞範圍內：點擊高度是否在擋板所在的水平區間內。點擊的水平位置是否在擋板的左緣和右緣之間。 */
    isDragging = true;                                                 /* 如果滑鼠確實點中了擋板，就把拖曳狀態設為 true，允許開始拖曳。 */
  }
});                                                                    /* 結束判斷式與按下事件監聽。 */
// --- 滑鼠移動監聽 ---
canvas.addEventListener("mousemove", e=>{                              /* 監聽滑鼠在畫布上的「移動」動作。 */
  if(isDragging){                                                      /* 只有在 isDragging 為 true（也就是玩家正按住擋板）的情況下，才執行裡面的移動邏輯。如果只是純移動滑鼠沒按住，就不會理它。 */
    const rect = canvas.getBoundingClientRect();                       /* 再次取得畫布的絕對位置（確保座標計算精確）。 */
    const moveX = e.clientX - rect.left;                               /* 計算滑鼠目前在畫布內部的最新 X 軸座標。 */
    paddleX = moveX - paddleWidth / 2;                                 /* 將擋板的中心點對齊滑鼠的 X 軸位置，讓拖曳感更直覺。 */
    if(paddleX < 0) paddleX = 0;                                       /* 限制左邊界，防止擋板移出畫布左邊。 */
    if(paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;                  /* 限制右邊界，防止擋板移出畫布右邊。 */
  }
});                                                                    /* 結束判斷式與移動事件監聽。 */
// --- 滑鼠放開監聽 ---
canvas.addEventListener("mouseup", ()=>{ isDragging = false; });       /* 當玩家「放開」滑鼠左鍵時，將拖曳狀態設回 false，停止移動擋板。 */
// --- 滑鼠超出畫布範圍，就算放開監聽 ---
canvas.addEventListener("mouseleave", ()=>{ isDragging = false; });    /* 當滑鼠不小心「移出」整個畫布範圍時，同樣強迫將拖曳狀態設為 false，避免滑鼠繞一圈回來後擋板還黏在滑鼠上的靈異現象。 */

// --- "暫停按鈕"點擊監聽 ---
pause.addEventListener("click", ()=>{                             
  if (gameRunning) {
    pause.textContent ='取消暫停';  
    gameRunning=false;
  }               
  else if (!gameRunning) {
    pause.textContent ='暫停';  
    gameRunning=true;
    play(); 
  }                           
});         
// --- "重新開始按鈕"點擊監聽 ---
restartBtn.addEventListener("click", ()=>{                             /* 監聽重新開始按鈕 (restartBtn) 的「點擊」動作。 */
  win_status = false;
  initialize();                                                          /* 呼叫遊戲初始化函式，重置分數、生命、磚塊陣列與球的位置。 */
  play();                                                              /* 呼叫繪製函式，重新啟動遊戲的畫面渲染與主循環。 */
});

initialize();                                                         /* 定義初始化遊戲的基本參數。 。 */
play();                                                               /* 開始進入遊戲主迴圈（動畫進行）。 */
</script>                                                             <!-- /* 結束 JavaScript */ -->
